# Production stack for a single VPS: Caddy (HTTPS) -> API -> RabbitMQ + SQLite volume.
# Run from the deploy/ folder:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: ../backend
      dockerfile: src/MobileLoginAuth.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/mobileloginauth.db"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      Smtp__FromName: ${SMTP_FROM_NAME:-MobileLoginAuth}
    volumes:
      - api-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Not published to the internet. Reach the UI with an SSH tunnel:
    #   ssh -L 15672:localhost:15672 you@server   then open http://localhost:15672
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional test inbox that catches every email (like Papercut). Start with --profile testmail
  # and set SMTP_HOST=mailhog, SMTP_PORT=1025, SMTP_USE_SSL=false in .env. View it via SSH tunnel:
  #   ssh -L 8025:localhost:8025 root@<server>   then open http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    profiles: ["testmail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  caddy-data:
  caddy-config:
  api-data:
  rabbitmq-data:
