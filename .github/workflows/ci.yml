name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/src/MobileLoginAuth.Api/Dockerfile backend
      - name: Lint server setup script
        run: shellcheck --severity=warning deploy/setup-server.sh deploy/backup-db.sh
      - name: Validate production compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SIGNING_KEY=.*/JWT_SIGNING_KEY=ci-only-key/; s/^RABBITMQ_PASSWORD=.*/RABBITMQ_PASSWORD=ci/' .env
          docker compose -f docker-compose.prod.yml --env-file .env config -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci --coverage
